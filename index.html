<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Campaña Diciembre 2026 · Dental Nakeji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Diseño: sitio de campañas. Header oscuro con logo y botones neón desplegables; portada = calendario con dibujos; cada día = guion, storyboard y post tipo Instagram */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --tint:#eaf1fa; --line:#d5deea;
  --ink:#1d3152; --text:#33415a; --muted:#5a6880;
  --brand:#3a70b0; --gold:#9a6f1c; --gold-soft:#f6ecd4; --warn:#9a5b00; --warn-soft:#fdf1dc;
  --w1:#2f66a8; --w2:#0f7a57; --w3:#9a6a12; --w4:#b23a32; --w5:#6b4fa0;
  --head:#070f1f; --head2:#0d1a33; --n0:#22d3ee; --n1:#60a5fa; --n2:#34d399; --n3:#fbbf24; --n4:#fb7185; --n5:#c084fc;
  --f-display:"Zilla Slab",Georgia,serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-ui:"Montserrat","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1529; --surface:#111f38; --tint:#16294a; --line:#243a5f;
  --ink:#f2f5fa; --text:#cdd6e4; --muted:#93a1b8;
  --brand:#7bc3eb; --gold:#e0b65c; --gold-soft:#2b2615; --warn:#f0b452; --warn-soft:#33260f;
  --w1:#7bb4f0; --w2:#5fd3a6; --w3:#e8c068; --w4:#f59a92; --w5:#c4adf0; --head:#040a16; --head2:#0a1529; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1529; --surface:#111f38; --tint:#16294a; --line:#243a5f;
  --ink:#f2f5fa; --text:#cdd6e4; --muted:#93a1b8;
  --brand:#7bc3eb; --gold:#e0b65c; --gold-soft:#2b2615; --warn:#f0b452; --warn-soft:#33260f;
  --w1:#7bb4f0; --w2:#5fd3a6; --w3:#e8c068; --w4:#f59a92; --w5:#c4adf0; --head:#040a16; --head2:#0a1529; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--f-body)}
a{color:var(--brand)}
a:focus-visible,button:focus-visible{outline:2px solid var(--n0);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);color:var(--ink);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.8rem,3.8vw,2.6rem)}
h2{font-size:1.35rem}
p{margin:0}
.muted{color:var(--muted);font-size:.86rem}
.k{font:700 .64rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ico{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Header oscuro con botones neón */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:1px solid #1b2a47}
.bar{max-width:1240px;margin:0 auto;height:68px;display:flex;align-items:center;gap:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap;flex:none;border-radius:10px}
/* Si los botones no caben en una fila, el programa pone la clase .compact y aparece el botón «Semanas» */
.tabs{display:flex;gap:8px;overflow:hidden;min-width:0;flex:1;padding:8px 4px}
.neon{--nc:var(--n0);font:700 .78rem var(--f-ui);letter-spacing:.02em;color:var(--nc);text-decoration:none;min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--nc);box-shadow:0 0 10px -3px var(--nc),inset 0 0 8px -5px var(--nc);text-shadow:0 0 8px var(--nc);background:transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;flex:none;transition:background .15s,color .15s,transform .1s}
.neon:hover,.neon.on,.neon[aria-expanded="true"]{background:var(--nc);color:var(--head);text-shadow:none}
.tabs:has([aria-expanded="true"]) .neon.on:not([aria-expanded="true"]):not(:hover){background:transparent;color:var(--nc);text-shadow:0 0 8px var(--nc)}
.neon:active{transform:scale(.97)}
.neon:focus-visible{outline-color:var(--nc);outline-offset:3px}
.car{display:inline-grid;width:12px;height:12px;flex:none;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.car .ico{stroke-width:2.6}
[aria-expanded="true"]>.car{transform:rotate(180deg)}
.wkbtn{display:none;margin-left:auto;padding:0 14px 0 12px;min-height:44px}
.wkbtn .dots{display:inline-flex;gap:3px}
.wkbtn .dots i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.topbar.compact .bar{gap:12px}
.topbar.compact .tabs{display:none}
.topbar.compact .wkbtn{display:inline-flex}

/* Panel de una semana (computadora) */
.mega{position:absolute;left:0;right:0;top:100%;background:radial-gradient(120% 140% at 50% -20%,#14305a 0,var(--head2) 55%,var(--head) 100%);border-bottom:1px solid #1b2a47;box-shadow:0 22px 30px -18px rgba(0,0,0,.6);transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1)}
@starting-style{.mega{opacity:0;transform:translateY(-6px)}}
.mega::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(96,165,250,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.mega .in{position:relative;max-width:1240px;margin:0 auto;padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.hd{display:flex;align-items:center;gap:6px 14px;min-width:0}
.hd b{font:700 1.1rem/1.25 var(--f-display);color:var(--nc);text-shadow:0 0 12px var(--nc)}
.hd .dt{color:#9fb0c9;font-size:.86rem;white-space:nowrap}
/* «DENTAL NAKEJI» pasa en el hueco de la línea del título, nunca detrás de las tarjetas */
.marq{flex:1 1 0;min-width:3rem;align-self:stretch;display:flex;align-items:center;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.marq span{flex:none;white-space:nowrap;font:800 2.1rem/1 var(--f-ui);letter-spacing:.06em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--nc) 26%,transparent);animation:marq 48s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.mega .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.mcard{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:8.75rem;padding:12px;border-radius:14px;text-decoration:none;color:#f2f5fa;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 30%,transparent);transition:transform .15s,box-shadow .15s,background .15s}
@media (hover:hover){.mcard:hover{transform:translateY(-2px);background:linear-gradient(160deg,color-mix(in srgb,var(--nc) 16%,transparent),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 70%,transparent),0 14px 24px -16px #000}}
.mcard:active{transform:scale(.985)}
.mcard:focus-visible{outline:2px solid var(--nc);outline-offset:2px}
.mcard[aria-current]{background:linear-gradient(160deg,color-mix(in srgb,var(--nc) 20%,transparent),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1.5px var(--nc)}
.mcard .top{display:flex;align-items:baseline;gap:6px}
.mcard .num{font:800 1.6rem/1 var(--f-ui);color:#fff;text-shadow:0 0 12px var(--nc);font-variant-numeric:tabular-nums}
.mcard .wd{font:700 .62rem var(--f-ui);color:#8fa3c2;text-transform:uppercase;letter-spacing:.1em}
.mcard .mi{margin-left:auto;align-self:flex-start;width:28px;height:28px;padding:5px;border-radius:8px;color:var(--nc);background:rgba(255,255,255,.06);flex:none}
.mcard .tt{font:600 .84rem/1.3 var(--f-body);text-wrap:pretty;overflow-wrap:anywhere}
.mcard .dd{margin-top:auto;font:700 .58rem/1.4 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--nc)}

/* Hoja de semanas (celular o pantalla angosta): sube desde abajo, al alcance del pulgar */
.scrim{position:fixed;inset:0;z-index:1;background:rgba(2,6,16,.62);touch-action:none;transition:opacity .25s}
@starting-style{.scrim{opacity:0}}
.sheet{--nc:var(--n0);position:fixed;z-index:2;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;max-height:min(86dvh,760px);display:flex;flex-direction:column;background:radial-gradient(130% 60% at 50% 0%,#14305a 0,var(--head2) 55%,var(--head) 100%);border:1px solid #1b2a47;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -18px 40px -12px rgba(0,0,0,.7);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
@starting-style{.sheet{transform:translateY(100%)}}
.sheet:focus{outline:none}
.sheet .hd{padding:10px 10px 10px 18px;border-bottom:1px solid #1b2a47}
.sx{flex:none;width:44px;height:44px;padding:13px;display:grid;border:0;border-radius:12px;background:rgba(255,255,255,.07);color:#cdd6e4;cursor:pointer}
.sx:hover{background:rgba(255,255,255,.12)}
.slist{position:relative;overflow-y:auto;overscroll-behavior:contain;display:grid;gap:6px;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px))}
.scal{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:14px;text-decoration:none;color:#f2f5fa;font:600 .92rem var(--f-ui);background:rgba(255,255,255,.05)}
.scal .mi{width:22px;height:22px;color:var(--n0)}
.scal small{margin-left:auto;font:600 .74rem var(--f-ui);color:#8fa3c2}
.scal:focus-visible,.swb:focus-visible,.sx:focus-visible{outline:2px solid var(--n0);outline-offset:2px}
.swb{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 16px;grid-template-areas:"lb car" "nm car";align-items:center;gap:6px 12px;min-height:64px;padding:10px 14px;border:0;border-radius:14px;background:transparent;color:#f2f5fa;font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 24%,transparent);transition:background .15s}
.swb[aria-expanded="true"]{background:color-mix(in srgb,var(--nc) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--nc) 55%,transparent)}
.swb .lb{grid-area:lb;display:flex;align-items:center;gap:10px;min-width:0}
.swb .pill{font:700 .7rem/1 var(--f-ui);letter-spacing:.03em;color:var(--nc);border:1.5px solid var(--nc);border-radius:99px;padding:5px 10px;text-shadow:0 0 8px var(--nc);box-shadow:0 0 10px -4px var(--nc);white-space:nowrap}
.swb[aria-expanded="true"] .pill{background:var(--nc);color:var(--head);text-shadow:none}
.swb .dt{font:600 .74rem var(--f-ui);color:#8fa3c2;font-variant-numeric:tabular-nums;white-space:nowrap}
.swb .nm{grid-area:nm;font:600 1rem/1.3 var(--f-display)}
.swb .car{grid-area:car;width:16px;height:16px;color:var(--nc)}
.sdays{display:grid;gap:6px;padding:2px 0 10px 10px}
.sheet .mcard{display:grid;grid-template-columns:2.4rem minmax(0,1fr) 28px;grid-template-areas:"num tt mi" "wd dd mi";align-items:center;gap:2px 12px;min-height:0;padding:10px 12px}
.sheet .mcard .top{display:contents}
.sheet .mcard .num{grid-area:num;font-size:1.3rem;text-align:center}
.sheet .mcard .wd{grid-area:wd;text-align:center;letter-spacing:.06em}
.sheet .mcard .tt{grid-area:tt;font-size:.9rem}
.sheet .mcard .dd{grid-area:dd;margin:0}
.sheet .mcard .mi{grid-area:mi;margin:0;align-self:center}

/* Logo Dental Nakeji: «Dental», esfera que respira y «nakeji» */
.wm{font:700 1.1rem/1 var(--f-ui);color:#fff;letter-spacing:-.01em}
.wm2{font-weight:800}
.wm2 sup{font-size:.45em;margin-left:1px;opacity:.8}
.orb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d6f3ff 0,#6cc4f5 28%,#2a6fd0 62%,#0b2a5c 100%);animation:breathe 3.4s ease-in-out infinite;flex:none}
.orb svg{width:58%;height:58%}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 14px 1px rgba(96,165,250,.45)}50%{transform:scale(1.07);box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 26px 6px rgba(96,165,250,.7)}}
.mk{margin-left:6px;font:700 .6rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--n0);border:1px solid var(--n0);border-radius:99px;padding:3px 8px;text-shadow:0 0 8px var(--n0);box-shadow:0 0 10px -4px var(--n0)}

/* Idea y objetivo · idioma del post */
.ideacard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wc);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.pside .irow,.irow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:baseline}
.irow .v{color:var(--ink)}
.irow .v.big{font:600 1.08rem/1.4 var(--f-display)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--surface);gap:2px;justify-self:start}
.lang button{font:700 .78rem var(--f-ui);border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pcol{display:grid;gap:12px;align-content:start;min-width:0}
.pcol .copybig{width:100%}
.score{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.score b{font:700 1.1rem var(--f-ui);color:var(--ink);margin-right:4px}
.score span{font:600 .72rem var(--f-ui);background:var(--tint);color:var(--muted);border-radius:99px;padding:3px 9px}
.lote{background:var(--tint);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:.9rem}
.lote b{color:var(--ink)}
.chip-ok{font:700 .52rem var(--f-ui);letter-spacing:.05em;color:var(--w2);border:1px solid var(--w2);padding:2px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.orb,.marq span{animation:none}.mcard,.mega,.sheet,.scrim,.car,.swb{transition:none}.mcard:hover,.mcard:active,.neon:active{transform:none}}

/* Cuerpo */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:44px;padding-block:30px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:calc(92px + env(safe-area-inset-top,0px));align-self:start;display:grid;gap:14px}
.side h2{font-size:1.05rem;color:var(--wc)}
.side nav{display:grid;gap:2px;font-size:.9rem}
.side nav a{color:var(--muted);text-decoration:none;padding:7px 10px;border-left:2px solid var(--line);display:flex;gap:8px}
.side nav a b{color:var(--gold);font:700 .8rem var(--f-ui)}
.side nav a:hover{color:var(--ink)}
.side nav a.on{color:var(--ink);border-left-color:var(--wc);background:var(--tint);font-weight:600}
.pager{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-block;font:600 .8rem var(--f-ui);border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:8px;padding:7px 12px;text-decoration:none;cursor:pointer}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{min-width:0}

/* Portada: texto corto y calendario como planificador de contenido */
.home-head{display:grid;gap:12px;margin-bottom:30px;max-width:880px}
.eyebrow{font:700 .72rem/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.lead{font-size:1.06rem;line-height:1.65;color:var(--text);max-width:68ch}
.metaline{font-size:.84rem;color:var(--muted);max-width:80ch}
.metaline b{color:var(--ink);font-weight:600}
.okdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--w2);vertical-align:middle;margin:0 2px 2px}
.monthbar{display:flex;align-items:baseline;justify-content:space-between;gap:6px 20px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.monthbar h2{font-size:1.55rem}
.monthbar span{font:600 .78rem var(--f-ui);color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal .dow{font:700 .64rem var(--f-ui);color:var(--muted);text-transform:uppercase;letter-spacing:.14em;padding:0 4px 2px}
.cal .dow.we{color:var(--gold)}
.cday{position:relative;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-rows:auto auto auto 1fr;gap:8px;min-width:0;box-shadow:inset 0 3px 0 var(--wc);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.cday:hover{transform:translateY(-3px);border-color:var(--wc);box-shadow:inset 0 3px 0 var(--wc),0 18px 30px -20px rgba(10,21,41,.6)}
.cday .top{display:flex;align-items:baseline;gap:6px;min-width:0}
.cday .d{font:700 1.3rem/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.cday .dw{font:600 .6rem var(--f-ui);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.cday .stt{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--line);align-self:center;flex:none}
.cday .stt.ok{background:var(--w2);box-shadow:0 0 0 3px color-mix(in srgb,var(--w2) 22%,transparent)}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--tb) 86%,#ffffff 14%),var(--tb));color:var(--tf);display:grid;place-items:center;padding:14px 9px 32px;isolation:isolate}
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--wc) 40%,transparent),transparent 62%);z-index:-1}
.thumb .bars{position:absolute;top:6px;left:8px;right:8px;display:flex;gap:3px}
.thumb .bars i{flex:1;height:2px;border-radius:2px;background:currentColor;opacity:.3}
.thumb .bars i:first-child{opacity:.95}
.thumb .hook{font:700 .78rem/1.25 var(--f-display);text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumb .ic{position:absolute;bottom:6px;right:6px;width:22px;height:22px;padding:3px;border-radius:6px;background:rgba(255,255,255,.18);color:currentColor}
.thumb .pt2{position:absolute;bottom:7px;left:8px;font:700 .52rem var(--f-ui);letter-spacing:.06em;background:rgba(5,12,26,.42);color:#fff;padding:2px 6px;border-radius:99px}
.cday .fm{font:700 .58rem var(--f-ui);letter-spacing:.11em;text-transform:uppercase;color:var(--wc)}
.cday .st{font:600 .9rem/1.25 var(--f-display);color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cpad{border-radius:14px;padding:10px;border:1px dashed var(--line);display:flex;gap:6px;align-items:baseline;align-content:start;opacity:.6}
.cpad .d{font:700 1.3rem/1 var(--f-display);color:var(--muted)}
.cpad .dw{font:600 .6rem var(--f-ui);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.tp{font:700 .56rem var(--f-ui);letter-spacing:.05em;color:var(--tf);background:var(--tb);padding:3px 6px;border-radius:4px}
.pt{font:700 .56rem var(--f-ui);letter-spacing:.04em;color:var(--wc);border:1px solid var(--wc);padding:2px 5px;border-radius:4px}
@media (max-width:1060px){.thumb .hook{font-size:.68rem}.cday .st{font-size:.82rem}.cday{padding:8px}}
@media (prefers-reduced-motion:reduce){.cday,.neon{transition:none}.cday:hover{transform:none}}

/* Página del video */
.vhead{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:12px}
.vhead .big{width:64px;height:64px;padding:12px;border-radius:16px;background:var(--tint);color:var(--wc);border:1px solid var(--line)}
.vhead .txt{display:grid;gap:6px;min-width:0}
.vhead h1{color:var(--wc)}
.vhead .meta{font-size:.86rem;color:var(--muted)}
.vhead .meta a{font-weight:600}
.dstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 16px;border-bottom:1px solid var(--line);margin-bottom:26px}
.dstrip a{font:600 .76rem var(--f-ui);color:var(--muted);text-decoration:none;padding:6px 11px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.dstrip a:hover{color:var(--ink);background:var(--tint)}
.dstrip a.on{background:var(--wc);border-color:var(--wc);color:var(--surface)}
.vs{display:grid;gap:14px;margin-bottom:44px;scroll-margin-top:96px}
.vs > h2{display:flex;gap:10px;align-items:baseline}
.vs > h2 .num{font:700 .8rem var(--f-ui);color:var(--gold)}
/* Guion sencillo */
.gcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wc);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.beat{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:baseline}
.beat .t{font:700 .72rem var(--f-ui);color:var(--gold);font-variant-numeric:tabular-nums}
.beat .say{font-size:1.02rem;color:var(--ink);line-height:1.45}
.beat .see{font-size:.84rem;color:var(--muted)}
.beat.end .say{font-size:.9rem;color:var(--muted)}
/* Storyboard */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:10px;overflow-x:auto;padding-bottom:6px}
.sc{display:grid;gap:5px;align-content:start;min-width:0}
.frame{aspect-ratio:9/16;max-width:100%;border-radius:12px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;background:var(--fb);color:var(--ff);overflow:hidden}
.frame .tc{align-self:flex-start;font:700 .6rem var(--f-ui);background:rgba(255,255,255,.9);color:#0a1529;padding:3px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.frame .bigt{display:grid;gap:5px;text-align:center;font:700 .9rem/1.2 var(--f-display)}
.frame .bigt.many{font-size:.7rem;gap:3px}
.frame .smt{font:600 .6rem/1.3 var(--f-ui);opacity:.85;text-align:center}
.frame .logo{margin:0 auto;width:44%;aspect-ratio:1;border:2px dashed currentColor;border-radius:8px;display:grid;place-items:center;font:700 .56rem var(--f-ui)}
.frame .wa{background:#25d366;color:#0a1529;border-radius:99px;padding:5px 6px;font:700 .54rem var(--f-ui);text-align:center}
.sbwrap{position:relative;min-width:0}
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;font:700 .82rem var(--f-ui);color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px 8px 12px}
.back span{font-size:1.1rem;line-height:1}
.back:hover{background:var(--tint)}
.vs>*{min-width:0}
.gline>div{min-width:0;overflow-wrap:anywhere}
.sbnav{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.sbnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 1rem var(--f-ui);cursor:pointer}
.board{grid-auto-columns:170px;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.sc{scroll-snap-align:start}
.frame .lt{display:flex;justify-content:space-between;align-items:center;gap:4px}
.frame .lt b{font:800 .66rem var(--f-ui);letter-spacing:.1em;background:var(--ff);color:var(--fb);padding:3px 7px;border-radius:99px}
.frame .lt span{font:700 .58rem var(--f-ui);opacity:.8;font-variant-numeric:tabular-nums}
.frame .sk{width:58%;margin:4px auto 0;opacity:.9}
.frame .sk .ico{stroke-width:1.3;stroke-dasharray:3 2.2}
.sc .cap2{font:600 .74rem/1.35 var(--f-ui);color:var(--muted)}
.guion{display:grid;gap:8px}
.gline{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gline .lt2{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--wc);color:var(--surface);font:800 .95rem var(--f-ui)}
.gline .tm{font:700 .66rem var(--f-ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gline .say{font:600 1rem/1.45 var(--f-display);color:var(--ink)}
.gline .see{font-size:.84rem;color:var(--muted)}
.gline .nov{font-size:.9rem;color:var(--muted);font-style:italic}
/* Post tipo Instagram */
.postwrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
.ig{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -22px rgba(10,21,41,.5)}
.ig-top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ig-top .av{width:34px;height:34px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#fbbf24,#fb7185,#7c3aed)}
.ig-top .av svg{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--surface)}
.ig-top b{display:block;font-size:.86rem;color:var(--ink)}
.ig-top small{display:block;font-size:.72rem;color:var(--muted)}
.ig-top .more{margin-left:auto;color:var(--muted);font-weight:700;letter-spacing:2px}
.ig-media{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.ig-media::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;aspect-ratio:4/5;max-width:100%;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;font:700 1.15rem/1.3 var(--f-display);text-align:center}
.slide.s0{background:#0f2a4f;color:#fff}
.slide.s1{background:#eaf1fa;color:#14243f}
.slide.s2{background:#e0b65c;color:#0a1529}
.slide small{font:700 .66rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ig-dots{display:flex;justify-content:center;gap:5px;padding:8px 0 0}
.ig-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.ig-dots i.on{background:var(--brand)}
.ig-act{display:flex;align-items:center;gap:14px;padding:6px 12px 4px;color:var(--ink)}
.ig-act svg{width:24px;height:24px}
.ig-act .sv{margin-left:auto}
.ig-cap{padding:4px 12px 6px;font-size:.86rem;white-space:pre-line;color:var(--text)}
.ig-cap b{color:var(--ink)}
.ig-time{padding:0 12px 12px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pside{display:grid;gap:14px;align-content:start}
.copybig{display:flex;align-items:center;justify-content:center;gap:8px;font:700 .9rem var(--f-ui);background:linear-gradient(135deg,#fbbf24,#fb7185 50%,#7c3aed);color:#fff;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;box-shadow:0 10px 22px -12px rgba(124,58,237,.7)}
.copybig svg{width:18px;height:18px}
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:.88rem}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kws span{font-size:.78rem;background:var(--tint);color:var(--ink);border-radius:99px;padding:4px 10px}
.pend{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.84rem}
.vpager{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px}
#printAll{display:none}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .postwrap{grid-template-columns:minmax(0,1fr)}
  .ig{max-width:420px}
}
@media (max-width:640px){
  .irow{grid-template-columns:minmax(0,1fr);gap:2px}
  .cal{grid-template-columns:minmax(0,1fr);gap:8px}
  .cal .dow,.cpad{display:none}
  .cday{grid-template-columns:44px 72px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top thumb fm" "top thumb st";align-items:start;column-gap:12px;row-gap:4px;padding:10px}
  .cday .top{grid-area:top;flex-direction:column;align-items:flex-start;gap:3px}
  .cday .stt{margin-left:0;margin-top:4px}
  .cday .thumb{grid-area:thumb;aspect-ratio:4/5;padding:9px 5px 5px}
  .cday .thumb .hook{font-size:.58rem;-webkit-line-clamp:4}
  .cday .thumb .ic,.cday .thumb .pt2{display:none}
  .cday .fm{grid-area:fm}
  .cday .st{grid-area:st;font-size:.95rem}
  .vhead{grid-template-columns:44px minmax(0,1fr)}
  .vhead .big{width:44px;height:44px;padding:8px}
  .beat{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:520px){.mk{display:none}}
@media (max-width:400px){.wm{font-size:1rem}.orb{width:28px;height:28px}.brand{gap:8px}}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

@media print{
  @page{margin:13mm}
  :root{--bg:#fff!important;--surface:#fff!important;--tint:#eef3f9!important;--line:#cfd8e4!important;--ink:#14243f!important;--text:#2a3850!important;--muted:#55627a!important;--brand:#3a70b0!important;--gold:#9a6f1c!important;--gold-soft:#f6ecd4!important;--warn:#9a5b00!important;--warn-soft:#fdf1dc!important;--w1:#2f66a8!important;--w2:#0f7a57!important;--w3:#9a6a12!important;--w4:#b23a32!important;--w5:#6b4fa0!important;color-scheme:light!important}
  body{font-size:11px;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,.topbar,.side,#viewDay,.copybig,.vpager,.dstrip{display:none!important}
  #viewCal[hidden]{display:block!important}
  .layout{display:block;padding:0}
  #printAll{display:block}
  .pday{break-before:page}
  .board{grid-auto-flow:row;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-columns:auto}
  .ig-media{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-columns:auto;gap:4px}
  .slide{font-size:.8rem;padding:12px}
  .gcard,.board,.postwrap{break-inside:avoid}
  .cday:hover{transform:none;box-shadow:none}
}

      h+='<section class="vs"'+id('storyboard')+'><h2><span class="num">1</span>Storyboard y guion</h2><div class="board">'+frame(x,[0,2,'',x.gan])+'</div><div class="lote">El guion completo se escribe con el <b>lote '+lote+' (días '+LR+')</b>, cuando apruebes el calendario de ideas. Aquí ya va su gancho.</div></section>';
      h+='<section class="vs"'+id('post')+'><h2><span class="num">2</span>Post e idea</h2><div class="lote">El post en español e inglés se escribe con el <b>lote '+lote+'</b>.</div><div class="info" style="margin-top:12px"><span class="k">Palabras clave (SEO)</span><div class="kws">'+x.kw.map(function(k){return '<span>'+k+'</span>';}).join("")+'</div></div><div style="margin-top:12px">'+ideaS+'</div></section>';
    }
    return h;}

  var tabs=document.getElementById('tabs'),mega=document.getElementById('mega'),side=document.getElementById('side'),layout=document.getElementById('layout');
  var topbar=document.getElementById('topbar'),wkBtn=document.getElementById('wkBtn'),sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
  var viewCal=document.getElementById('viewCal'),viewDay=document.getElementById('viewDay');
  var WK=Object.keys(WEEKS).map(Number),CAR='<span class="car" aria-hidden="true">'+icon('chev')+'</span>';
  var MARQ='<div class="marq" aria-hidden="true"><span>'+Array(9).join('DENTAL NAKEJI · ')+'</span></div>';
  tabs.innerHTML='<a class="neon" href="#calendario" data-k="cal" style="--nc:var(--n0)">Calendario</a>'+WK.map(function(w){return '<button type="button" class="neon" data-k="w'+w+'" data-w="'+w+'" aria-expanded="false" aria-controls="mega" style="--nc:'+WEEKS[w].nc+'">'+wlabel(w)+CAR+'</button>';}).join("");
  wkBtn.innerHTML='<span class="dots" aria-hidden="true">'+WK.map(function(w){return '<i style="--c:'+WEEKS[w].nc+'"></i>';}).join("")+'</span>Semanas';
  var DOWN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  var g=DOWN.map(function(n,i){return '<div class="dow'+(i>4?' we':'')+'">'+n+'</div>';}).join("")+'<div class="cpad" aria-hidden="true"><span class="d">30</span><span class="dw">nov</span></div>';
  D.forEach(function(x){var tp=TPL[x.t],q=parseScreen(x.gan).big,hk=q.length?q[q.length-1]:'';if(hk.length<12)hk=x.vt.replace(/[«»]/g,'');
    g+='<a class="cday" href="#dia-'+x.d+'" style="--wc:'+WEEKS[x.w].c+';--tb:'+tp.bg+';--tf:'+tp.fg+'" aria-label="'+dayName(x.d)+': '+x.st+(x.g?' (guion y post listos)':'')+'">'+
      '<span class="top"><span class="d">'+x.d+'</span><span class="dw">'+DOWS[x.d%7]+'</span><span class="stt'+(x.g?' ok':'')+'" title="'+(x.g?'Guion y post listos':'Idea; el guion se escribe con su lote')+'"></span></span>'+
      '<span class="thumb"><span class="bars"><i></i><i></i><i></i></span><span class="hook">'+hk+'</span>'+(x.part?'<span class="pt2">PARTE '+x.part+'/2</span>':'')+'<span class="ic">'+icon(x.ic)+'</span></span>'+
      '<span class="fm">'+x.fm+'</span><span class="st">'+x.st+'</span></a>';});
  g+=['1','2','3'].map(function(n){return '<div class="cpad" aria-hidden="true"><span class="d">'+n+'</span><span class="dw">ene</span></div>';}).join("");
  document.getElementById('calGrid').innerHTML=g;

  var openW=0,sheetOpen=false,curD=0,compact=false;
  function cards(w){var W=WEEKS[w],h='';
    for(var i=W.first;i<=W.last;i++){var x=D[i-1];h+='<a class="mcard" href="#dia-'+i+'"'+(i===curD?' aria-current="page"':'')+'><span class="top"><span class="num">'+i+'</span><span class="wd">'+DOWS[i%7]+'</span><span class="mi">'+icon(x.ic)+'</span></span><span class="tt">'+x.st+'</span><span class="dd">'+x.fm+(x.part?' · '+partTxt(x):'')+'</span></a>';}
    return h;}
  // Cierra el panel de semana (computadora) y la hoja de semanas (celular); back=true regresa el foco al botón que los abrió
  function closeMega(back){
    var b=openW?tabs.querySelector('[data-w="'+openW+'"]'):sheetOpen?wkBtn:null;
    openW=0;mega.hidden=true;tabs.querySelectorAll('[data-w]').forEach(function(x){x.setAttribute('aria-expanded','false');});
    sheetOpen=false;sheet.hidden=true;scrim.hidden=true;wkBtn.setAttribute('aria-expanded','false');
    if(back&&b)b.focus();}
  function openMega(w){
    var W=WEEKS[w];
    mega.style.setProperty('--nc',W.nc);
    mega.innerHTML='<div class="in"><div class="hd"><b>'+wlabel(w)+' · '+W.n+'</b><span class="dt">'+W.first+' al '+W.last+' de diciembre</span>'+MARQ+'</div><div class="grid">'+cards(w)+'</div></div>';
    openW=w;mega.hidden=false;tabs.querySelectorAll('[data-w]').forEach(function(b){b.setAttribute('aria-expanded',String(+b.getAttribute('data-w')===w));});}
  function openSheet(){
    var cw=curD?D[curD-1].w:0;
    sheet.innerHTML='<div class="hd"><b>Semanas</b>'+MARQ+'<button type="button" class="sx" aria-label="Cerrar">'+icon('x')+'</button></div>'+
      '<div class="slist"><a class="scal" href="#calendario"><span class="mi">'+icon('calendar')+'</span>Calendario completo<small>'+D.length+' días</small></a>'+
      WK.map(function(w){var W=WEEKS[w],on=w===cw;return '<div class="sw" style="--nc:'+W.nc+'"><button type="button" class="swb" data-sw="'+w+'" aria-expanded="'+on+'" aria-controls="sw'+w+'"><span class="lb"><span class="pill">'+wlabel(w)+'</span><span class="dt">'+W.first+' al '+W.last+' dic</span></span><span class="nm">'+W.n+'</span>'+CAR+'</button><div class="sdays" id="sw'+w+'"'+(on?'':' hidden')+'>'+cards(w)+'</div></div>';}).join("")+'</div>';
    sheetOpen=true;sheet.hidden=false;scrim.hidden=false;wkBtn.setAttribute('aria-expanded','true');
    sheet.focus({preventScroll:true});
    var ex=sheet.querySelector('.swb[aria-expanded="true"]');if(ex)showWeek(ex);}
  // Sube la semana abierta al inicio de la lista y deja asomar la fila de arriba, para que se note que hay más
  function showWeek(b){b.parentNode.parentNode.scrollTop=b.parentNode.offsetTop-34;}
  tabs.addEventListener('click',function(e){var b=e.target.closest('[data-w]');if(!b)return;var w=+b.getAttribute('data-w');if(openW===w)closeMega();else openMega(w);});
  wkBtn.addEventListener('click',function(){if(sheetOpen)closeMega();else openSheet();});
  sheet.addEventListener('click',function(e){
    if(e.target.closest('.sx')){closeMega(true);return;}
    var b=e.target.closest('[data-sw]');if(!b)return;
    var on=b.getAttribute('aria-expanded')!=='true';
    sheet.querySelectorAll('[data-sw]').forEach(function(o){var x=o===b&&on;o.setAttribute('aria-expanded',String(x));o.nextElementSibling.hidden=!x;});
    if(on)showWeek(b);});
  document.addEventListener('click',function(e){if((openW||sheetOpen)&&(e.target.closest('#mega a,#sheet a')||!e.target.closest('.bar,#mega,#sheet')))closeMega();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(openW||sheetOpen))closeMega(true);});
  topbar.addEventListener('focusout',function(e){var t=e.relatedTarget;if(t&&!topbar.contains(t))closeMega();});
  // Quiebre por contenido: si los botones no caben en una fila (cualquier texto, cualquier ancho), se cambia al botón «Semanas»
  function fit(){topbar.classList.remove('compact');var c=tabs.scrollWidth>tabs.clientWidth;topbar.classList.toggle('compact',c);if(c!==compact){compact=c;closeMega();}}
  fit();window.addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);

  var obs=null;
  function setTab(k){tabs.querySelectorAll('.neon').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-k')===k);});}
  function openCal(){curD=0;viewDay.hidden=true;viewDay.innerHTML='';viewCal.hidden=false;layout.classList.add('solo');side.hidden=true;setTab('cal');if(obs)obs.disconnect();}
  function openDay(n){
    var x=D[n-1],wk=WEEKS[x.w];curD=n;
    viewCal.hidden=true;viewDay.hidden=false;layout.classList.remove('solo');side.hidden=false;
    viewDay.innerHTML='<a class="back" href="#calendario"><span aria-hidden="true">←</span> Volver al calendario</a>'+renderDay(x,false)+'<div class="vpager">'+(n>1?'<a class="btn" href="#dia-'+(n-1)+'">← Día '+(n-1)+'</a>':'<span></span>')+'<a class="btn" href="#calendario">Calendario</a>'+(n<31?'<a class="btn dark" href="#dia-'+(n+1)+'">Día '+(n+1)+' →</a>':'<span></span>')+'</div>';
    setTab('w'+x.w);
    side.style.setProperty('--wc',wk.c);
    side.innerHTML='<span class="k">Día '+n+' de 31 · '+dayShort(n)+'</span><h2>'+x.st+'</h2><nav id="secNav">'+SECS.map(function(s,i){return '<a href="#s-'+s[0]+'" data-s="'+s[0]+'"><b>'+(i+1)+'</b>'+s[1]+'</a>';}).join("")+'</nav>'+
      '<div class="pager">'+(n>1?'<a class="btn" href="#dia-'+(n-1)+'">← '+(n-1)+'</a>':'')+'<a class="btn" href="#calendario">Calendario</a>'+(n<31?'<a class="btn" href="#dia-'+(n+1)+'">'+(n+1)+' →</a>':'')+'</div>';
    side.querySelectorAll('#secNav a').forEach(function(a){a.onclick=function(e){e.preventDefault();document.getElementById('s-'+a.getAttribute('data-s')).scrollIntoView({behavior:'smooth',block:'start'});};});
    viewDay.querySelectorAll('[data-sb]').forEach(function(b){b.onclick=function(){var bd=viewDay.querySelector('.board');bd.scrollBy({left:(+b.getAttribute('data-sb'))*180,behavior:'smooth'});};});
    var pcol=document.getElementById('pcol'),cur='es';
    if(pcol){
    function draw(){
      pcol.innerHTML=igPost(x,false,cur)+'<button type="button" class="copybig" id="copyBtn">'+svgi('copy')+(cur==='en'?'Copy post text':'Copiar texto de la publicación')+'</button>';
      var btn=document.getElementById('copyBtn'),label=btn.innerHTML,txt=fullCap(x,cur),cap=document.getElementById('capDay');
      btn.onclick=function(){function sel(){var r=document.createRange();r.selectNodeContents(cap);var s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent=cur==='en'?'Text selected: copy it':'Texto seleccionado: cópialo';}
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){btn.textContent=cur==='en'?'Copied! Paste it on Instagram':'¡Copiado! Pégalo en Instagram';setTimeout(function(){btn.innerHTML=label;},2500);},sel);}else{sel();}};
      var media=pcol.querySelector('.ig-media'),dots=pcol.querySelectorAll('.ig-dots i');
      if(media&&dots.length){media.addEventListener('scroll',function(){var i=Math.round(media.scrollLeft/media.clientWidth);dots.forEach(function(d,j){d.classList.toggle('on',j===i);});},{passive:true});}
    }
    draw();
    viewDay.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){cur=b.getAttribute('data-l');viewDay.querySelectorAll('.lang button').forEach(function(o){o.setAttribute('aria-pressed',String(o===b));});draw();};});
    }
    if(obs)obs.disconnect();
    if('IntersectionObserver' in window){obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var k=e.target.id.slice(2);side.querySelectorAll('#secNav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===k);});}});},{rootMargin:'-25% 0px -65% 0px'});
      viewDay.querySelectorAll('.vs[id]').forEach(function(s){obs.observe(s);});}
  }
  function route(){closeMega();var m=location.hash.match(/^#dia-(\d{1,2})$/);if(m&&+m[1]>=1&&+m[1]<=31)openDay(+m[1]);else openCal();window.scrollTo(0,0);}
  window.addEventListener('hashchange',route);
  document.getElementById('brand').addEventListener('click',function(){if(location.hash==='#calendario'||location.hash===''){openCal();window.scrollTo({top:0,behavior:'smooth'});}});
  route();
  document.getElementById('printAll').innerHTML=D.map(function(x){return '<article class="pday">'+renderDay(x,true)+'</article>';}).join("");
})();
</script>
